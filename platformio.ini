; ============================================================================
;  ESP32-C3 智能桌面小键盘 (BLE Keybrick) —— PlatformIO 工程
;
;  功能：BLE HID 键盘 + 6 组键位预设 + OLED 状态显示 + 电池电量
;        + 定时器 + 节拍器 + 蜂鸣器 + 5 颗 WS2812B 灯效
;
;  本板硬件（按原理图 Schematic1 / Board1 V1.0）：
;    USB 直连芯片内置 USB-Serial/JTAG（GPIO18=D-、GPIO19=D+），日志走这里
;
;  常用命令（在本目录下执行）：
;    pio run                    ; 只编译
;    pio device monitor         ; 看串口日志（115200）
;    powershell -ExecutionPolicy Bypass -File tools\flash.ps1 -Port COM16
;                               ; 烧录：必须用这个脚本，见下面第 2 条
; ============================================================================
[platformio]
default_envs = esp32c3

[env:esp32c3]
platform  = espressif32@6.10.0
board     = esp32-c3-devkitm-1
framework = arduino

; ----------------------------------------------------------------------------
; ① 日志必须走内置 USB-CDC，不能用 UART0
;    GPIO20 = K3，GPIO21 = 灯珠电源开关，而这两个脚正好是 UART0 的默认 RXD/TXD。
;    一旦日志走 UART0，bootloader 会把这两个脚的输出通路接到 UART0 上，
;    结果是：K3 读不到按键、灯珠电源永远拉不低（5 颗灯全灭）。
;    所以下面两行不能删。
; ----------------------------------------------------------------------------
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
build_unflags = -DARDUINO_USB_MODE=0

monitor_speed    = 115200
monitor_filters  = esp32_exception_decoder, time
upload_speed     = 460800

; ----------------------------------------------------------------------------
; ② 不要用 pio run -t upload
;    本板 USB 直连芯片内置 USB-Serial/JTAG。固件正在运行时，esptool 默认的
;    RTS/DTR 复位序列进不去 ROM 下载模式，会报 "Wrong boot mode detected (0xd)"。
;    PlatformIO 会把 --before default_reset 追加在你设置的 upload_flags 之后，
;    覆盖掉你的设置，所以只能绕开它 —— 用 tools\flash.ps1。
; ----------------------------------------------------------------------------
