<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Keybrick 改键</title>
<style>
  :root {
    --bg: #f4f5f7; --panel: #ffffff; --sunken: #f7f8fa; --ink: #17191e; --muted: #6b7280; --faint: #9aa1ac;
    --line: #e4e7ec; --line-strong: #d3d8df;
    --accent: #1f7a6d; --accent-ink: #ffffff; --accent-soft: #e3f2ef; --accent-line: #a9d6cd;
    --warn: #c2700a; --warn-soft: #fef3c7; --err: #b42318; --err-soft: #fee4e2; --ok: #15803d;
    --case-hi: #f6f4ef; --case-lo: #e6e3dc; --case-edge: #d6d2c9;
    --case-side: #d3cec4; --case-side-dk: #bdb8ad;
    --cap-hi: #fdfcf9; --cap-lo: #ebe8e1; --cap-edge: #d3cfc6; --cap-ink: #2b2a27; --cap-sub: #8f8b82;
    --cap-side: #dedad1; --cap-side-dk: #c9c4ba;
    --oled: #030506; --oled-ink: #dff6ff; --cable: #1c1d20;
    --desk-hi: #ffffff; --desk-lo: #e9ecf0; --ground: rgba(20, 24, 33, .38);
    --glass: rgba(255, 255, 255, .78);
    --mono: ui-monospace, "Cascadia Mono", Consolas, monospace;
    --shadow: 0 1px 2px rgba(16, 24, 40, .05);
    --pop-shadow: 0 18px 40px rgba(16, 24, 40, .18), 0 2px 6px rgba(16, 24, 40, .08);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121418; --panel: #1b1e23; --sunken: #16191d; --ink: #e7e9ee; --muted: #9aa1ac; --faint: #6b7280;
      --line: #2a2e35; --line-strong: #3a3f47;
      --accent: #3fb8a5; --accent-ink: #0b1513; --accent-soft: #19302c; --accent-line: #2f6b61;
      --warn: #f2b53a; --warn-soft: #362b12; --err: #f97066; --err-soft: #3a1c1a; --ok: #4ade80;
      --case-hi: #d9d6cf; --case-lo: #c9c5bd; --case-edge: #aaa69d;
      --case-side: #aaa59b; --case-side-dk: #8f8a80;
      --cap-hi: #e2dfd8; --cap-lo: #cfcbc3; --cap-edge: #a9a59c; --cap-ink: #23221f; --cap-sub: #77736b;
      --cap-side: #bab6ad; --cap-side-dk: #a29e95;
      --desk-hi: #23272e; --desk-lo: #121418; --ground: rgba(0, 0, 0, .7);
      --glass: rgba(27, 30, 35, .82);
      --shadow: none; --pop-shadow: 0 18px 40px rgba(0, 0, 0, .55);
    }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--ink); display: flex; flex-direction: column;
         font: 14px/1.5 system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif; }

  /* ---------------------------------------------------------------- 顶栏 */
  .topbar { flex: none; position: relative; z-index: 10; background: var(--panel); border-bottom: 1px solid var(--line); }
  .topbar-inner { max-width: 1280px; margin: 0 auto; padding: 12px 24px;
                  display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand svg { flex: none; }
  .brand h1 { font-size: 16px; margin: 0; line-height: 1.2; }
  .brand p { margin: 0; font-size: 12px; color: var(--muted); }
  .status { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px;
            background: var(--sunken); border: 1px solid var(--line); color: var(--muted); font-size: 12px; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--faint); }
  .dot.on { background: var(--ok); box-shadow: 0 0 0 3px color-mix(in srgb, var(--ok) 20%, transparent); }
  .spacer { flex: 1; }
  .toolbar { display: flex; gap: 8px; flex-wrap: wrap; }

  button { font: inherit; border: 1px solid var(--line-strong); background: var(--panel); color: var(--ink);
           height: 34px; padding: 0 14px; border-radius: 8px; cursor: pointer; white-space: nowrap;
           display: inline-flex; align-items: center; justify-content: center; gap: 6px;
           transition: background-color .18s, border-color .18s, color .18s, box-shadow .18s, opacity .18s; }
  button:hover:not(:disabled) { border-color: var(--accent); }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button:disabled { opacity: .45; cursor: not-allowed; }
  button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  button.primary:hover:not(:disabled) { filter: brightness(1.06); }
  button.ghost { border-color: transparent; background: transparent; color: var(--muted); }
  button.ghost:hover:not(:disabled) { color: var(--ink); border-color: var(--line-strong); }
  button.danger { color: var(--err); }
  button.danger:hover:not(:disabled) { border-color: var(--err); }
  button.busy::before { content: ""; width: 12px; height: 12px; border-radius: 50%;
                        border: 2px solid currentColor; border-right-color: transparent; animation: spin .7s linear infinite; }
  button.busy:disabled { opacity: .85; cursor: progress; }
  button.done { background: var(--ok); border-color: var(--ok); color: #fff; }
  .pending { min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; font-size: 11px; line-height: 18px;
             background: var(--warn); color: #fff; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes blink { 50% { opacity: .2; } }

  /* ---------------------------------------------------------------- 通知 */
  #notice { position: fixed; z-index: 40; top: 74px; left: 50%; transform: translateX(-50%);
            width: min(560px, calc(100% - 32px)); pointer-events: none; }
  .notice { display: flex; gap: 8px; align-items: flex-start; padding: 10px 14px; border-radius: 10px;
            border: 1px solid currentColor; box-shadow: 0 8px 24px rgba(16, 24, 40, .16);
            pointer-events: auto; cursor: pointer; animation: drop .18s ease-out; }
  .notice::before { font-weight: 700; }
  .notice.warn { background: var(--warn-soft); color: var(--warn); }
  .notice.err  { background: var(--err-soft);  color: var(--err); }
  .notice.ok   { background: var(--accent-soft); color: var(--accent); }
  .notice.warn::before { content: "!"; } .notice.err::before { content: "×"; } .notice.ok::before { content: "✓"; }
  .notice.hide { opacity: 0; transform: translateY(-6px); transition: opacity .25s, transform .25s; }
  @keyframes drop { from { opacity: 0; transform: translateY(-8px); } }

  /* ================================================================ 3D 舞台（整页就是它）
     .scene(透视) > .tilt(鼠标视差) > .float(悬浮 + 选中键时转向) > .kb(底面, 机位姿态)
     .kb 里：地面阴影、四个侧面、USB 线、顶面 #board（预设按钮 + 拨动开关 + OLED + 5 个立体键帽）
     模型按 900x300 的设计尺寸画，用 scale 适配舞台。 */
  main { flex: 1; min-height: 0; padding: 14px 24px 18px; max-width: 1280px; width: 100%; margin: 0 auto; display: flex; }
  .stage { position: relative; flex: 1; min-height: 540px; border-radius: 18px; border: 1px solid var(--line); overflow: hidden;
           background: radial-gradient(120% 90% at 50% 0%, var(--desk-hi), var(--desk-lo)); box-shadow: var(--shadow); }
  .scene { position: absolute; inset: 0; perspective: 1700px; perspective-origin: 50% 30%; }
  .tilt, .float, .kb { position: absolute; left: 50%; top: 50%; width: 900px; height: 300px;
                       margin: -150px 0 0 -450px; transform-style: preserve-3d; }
  .tilt  { transform: rotateX(var(--px, 0deg)) rotateY(calc(var(--py, 0deg) + var(--fy, 0deg)));
           transition: transform .6s ease-out; }
  .float { animation: bob 6s ease-in-out infinite; }
  @keyframes bob { 50% { transform: translateY(var(--bob, 0px)); } }
  .kb { --T: 26px; --kh: 20px;
        transform: translateY(var(--ky, 0px)) rotateX(var(--rx)) rotateZ(var(--rz)) scale(var(--s));
        transition: transform .95s cubic-bezier(.65, 0, .25, 1); }
  [data-view=home] .kb    { --rx: 58deg; --rz: -24deg; --s: var(--s-home, .6); --ky: var(--ky-home, -60px); }
  [data-view=home] .float { --bob: -14px; }
  [data-view=edit] .kb    { --rx: 30deg; --rz: 0deg;   --s: var(--s-edit, 1); --ky: var(--ky-edit, 0px); }
  [data-view=edit][data-sel] .kb { --rx: 34deg; --s: var(--s-sel, .9); --ky: var(--ky-sel, -80px); }

  .ground { position: absolute; inset: 4% 2%; border-radius: 40px; background: var(--ground); filter: blur(26px);
            transform: translateZ(-2px); }
  .side, .ks { backface-visibility: hidden; }
  .side { position: absolute; background: linear-gradient(var(--case-side), var(--case-side-dk)); }
  .side.f { left: 10px; right: 10px; top: 100%; height: var(--T); transform-origin: top;    transform: rotateX(90deg) rotateY(180deg); }
  .side.b { left: 10px; right: 10px; bottom: 100%; height: var(--T); transform-origin: bottom; transform: rotateX(-90deg) rotateY(180deg); }
  .side.r { top: 10px; bottom: 10px; left: 100%; width: var(--T); transform-origin: left;  transform: rotateY(-90deg) rotateX(180deg);
            background: linear-gradient(90deg, var(--case-side), var(--case-side-dk)); }
  .side.l { top: 10px; bottom: 10px; right: 100%; width: var(--T); transform-origin: right; transform: rotateY(90deg) rotateX(180deg);
            background: linear-gradient(-90deg, var(--case-side), var(--case-side-dk)); }
  .cable { position: absolute; left: 7%; bottom: calc(100% - 4px); width: 46px; height: 170px;
           transform: translateZ(calc(var(--T) * .5)); }
  .cable::before { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 30px; border-radius: 5px 5px 2px 2px;
                   background: linear-gradient(90deg, #2c2e33, #45484e 45%, #2c2e33); }
  .cable::after { content: ""; position: absolute; left: 14px; right: 14px; bottom: 28px; top: 0;
                  background: linear-gradient(90deg, #121315, #34363b 45%, #121315);
                  -webkit-mask: linear-gradient(to top, #000 55%, transparent); mask: linear-gradient(to top, #000 55%, transparent); }

  #board { position: absolute; inset: 0; transform: translateZ(var(--T)); transform-style: preserve-3d;
           display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); grid-template-rows: minmax(0, 1fr) auto;
           gap: 14px; padding: 18px; border-radius: 14px;
           background: linear-gradient(180deg, var(--case-hi), var(--case-lo));
           box-shadow: inset 0 1px 0 rgba(255,255,255,.75), inset 0 0 0 1px var(--case-edge); }

  /* 外壳左上：预设按钮 + 类型拨动开关（像印在外壳上的控件） */
  .deck { grid-column: 1 / 4; grid-row: 1; align-self: center; display: flex; align-items: center; gap: 22px;
          padding-left: 4px; transform: translateZ(1px); transition: opacity .5s; }
  [data-view=home] .deck { opacity: 0; pointer-events: none; }
  .pads { display: flex; gap: 12px; }
  .pad { position: relative; width: 46px; height: 46px; padding: 0; border-radius: 50%;
         border: 1px solid var(--cap-edge); color: var(--cap-sub); font-family: var(--mono); font-weight: 700; font-size: 17px;
         background: radial-gradient(circle at 50% 35%, var(--cap-hi), var(--cap-lo));
         box-shadow: inset 0 -3px 0 rgba(0,0,0,.06), 0 2px 3px rgba(0,0,0,.16);
         transition: background .3s, color .3s, border-color .3s, box-shadow .3s, transform .15s; }
  .pad:active { transform: scale(.94); }
  .pad:hover:not(:disabled) { border-color: var(--accent); color: var(--cap-ink); }
  .pad.on { color: var(--accent-ink); background: var(--accent); border-color: var(--accent);
            box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 25%, transparent), 0 0 22px color-mix(in srgb, var(--accent) 50%, transparent); }
  .pad.dirty::after { content: ""; position: absolute; top: 1px; right: 1px; width: 11px; height: 11px; border-radius: 50%;
                      background: var(--warn); border: 2px solid var(--case-hi); }
  .pad.cur::before { content: ""; position: absolute; left: 50%; bottom: -11px; width: 14px; height: 3px; margin-left: -7px;
                     border-radius: 2px; background: var(--accent); }
  .deck-label { font-family: var(--mono); font-size: 12px; letter-spacing: .14em; color: var(--cap-sub); margin-bottom: 6px; }
  .flip { display: inline-flex; padding: 4px; gap: 4px; border-radius: 12px; background: rgba(60, 50, 30, .12);
          box-shadow: inset 0 2px 4px rgba(0,0,0,.15); }
  .flip button { height: 36px; padding: 0 14px; border: 0; border-radius: 9px; background: transparent;
                 font-family: var(--mono); font-size: 13px; font-weight: 700; letter-spacing: .06em; color: var(--cap-sub);
                 transition: background .25s, color .25s, box-shadow .25s; }
  .flip button.on { background: linear-gradient(180deg, var(--cap-hi), var(--cap-lo)); color: var(--cap-ink);
                    box-shadow: 0 2px 3px rgba(0,0,0,.2), inset 0 1px 0 rgba(255,255,255,.8); }

  .oled { grid-column: 4 / 6; grid-row: 1; align-self: center; padding: 5px; border-radius: 5px; background: #111;
          transform: translateZ(1px); box-shadow: inset 0 0 0 1px rgba(0,0,0,.6), 0 1px 0 rgba(255,255,255,.6); }
  .oled .scr { display: flex; aspect-ratio: 4 / 1; background: var(--oled); border-radius: 2px; padding: 3% 4%;
               flex-direction: column; justify-content: space-around; overflow: hidden;
               font-family: var(--mono); color: var(--oled-ink); line-height: 1.15;
               font-size: clamp(14px, calc(13px / var(--s-edit, 1)), 26px);
               text-shadow: 0 0 5px rgba(150, 220, 255, .6); }
  .oled .ln { display: flex; align-items: center; gap: .5em; white-space: nowrap; min-width: 0; }
  .oled .ln > span:not(.bat) { overflow: hidden; text-overflow: ellipsis; }
  .oled .ln .r { margin-left: auto; flex: none; opacity: .9; }
  .oled .bat { flex: none; width: 1.5em; height: .75em; border: 1px solid currentColor; border-radius: 1px; position: relative;
               background: linear-gradient(90deg, currentColor 80%, transparent 80%) content-box; padding: 1px; }
  .oled .bat::after { content: ""; position: absolute; right: -3px; top: 25%; width: 2px; height: 50%; background: currentColor; }
  .oled .blink { animation: blink 1s steps(1) infinite; }
  [data-view=edit] .oname { cursor: text; border-bottom: 1px dashed transparent; }
  [data-view=edit] .oname:hover { border-bottom-color: currentColor; }
  .oname-in { font: inherit; color: inherit; text-shadow: inherit; background: transparent; border: 0; outline: 0;
              border-bottom: 1px solid currentColor; padding: 0; width: 12em; min-width: 0; caret-color: var(--oled-ink); }
  .oname-in.bad { color: #ff9b8f; }

  /* 立体键帽：.key3d 是键位（凹槽），里面 4 个侧面 + 顶面按钮 .cap */
  .key3d { grid-row: 2; position: relative; aspect-ratio: 1; transform-style: preserve-3d;
           transition: transform .22s cubic-bezier(.3, 1.6, .5, 1); }
  .key3d .well { position: absolute; inset: -5px; border-radius: 16px; background: rgba(60, 50, 30, .13);
                 box-shadow: inset 0 2px 4px rgba(0,0,0,.18); }
  .key3d .ks { position: absolute; background: linear-gradient(var(--cap-side), var(--cap-side-dk)); }
  .key3d .ks.f { left: 9px; right: 9px; top: 100%; height: var(--kh); transform-origin: top;    transform: translateY(-2px) rotateX(90deg) rotateY(180deg); }
  .key3d .ks.b { left: 9px; right: 9px; bottom: 100%; height: var(--kh); transform-origin: bottom; transform: translateY(2px) rotateX(-90deg) rotateY(180deg); }
  .key3d .ks.r { top: 9px; bottom: 9px; left: 100%; width: var(--kh); transform-origin: left;  transform: translateX(-2px) rotateY(-90deg) rotateX(180deg); }
  .key3d .ks.l { top: 9px; bottom: 9px; right: 100%; width: var(--kh); transform-origin: right; transform: translateX(2px) rotateY(90deg) rotateX(180deg); }
  .cap { position: absolute; inset: 0; height: auto; padding: 10% 11%; border-radius: 14px; transition: box-shadow .25s;
         transform: translateZ(var(--kh)); border: 1px solid var(--cap-edge); color: var(--cap-ink);
         background: linear-gradient(180deg, var(--cap-hi), var(--cap-lo));
         box-shadow: inset 0 -5px 0 rgba(0,0,0,.05), inset 0 1px 0 rgba(255,255,255,.85);
         display: flex; flex-direction: column; align-items: flex-start; justify-content: space-between; text-align: left; }
  .cap::before { content: ""; position: absolute; inset: 9%; border-radius: 12%; pointer-events: none;
                 background: radial-gradient(ellipse at 50% 35%, rgba(255,255,255,.6), transparent 70%); }
  .cap:hover:not(:disabled) { border-color: var(--cap-edge); }
  .cap:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
  [data-view=home] .cap { cursor: default; }
  [data-view=edit] .key3d:hover { transform: translateZ(-3px); }
  .key3d.sel, [data-view=edit] .key3d:active { transform: translateZ(-8px); }
  .key3d.sel .cap { box-shadow: 0 0 0 4px var(--accent), 0 0 26px color-mix(in srgb, var(--accent) 55%, transparent),
                                inset 0 -5px 0 rgba(0,0,0,.05); }
  .key3d.recording .cap { animation: recglow 1.1s ease-in-out infinite; }
  @keyframes recglow { 0%, 100% { box-shadow: 0 0 0 4px var(--err), 0 0 10px var(--err); }
                       50%      { box-shadow: 0 0 0 4px var(--err), 0 0 34px var(--err); } }
  .cap .kn { position: relative; font-family: var(--mono); color: var(--cap-sub);
             font-size: clamp(12px, calc(11px / var(--s-edit, 1)), 20px); }
  .cap .cc { position: relative; font-family: var(--mono); font-weight: 600; line-height: 1.25; width: 100%;
             overflow-wrap: anywhere; font-size: clamp(15px, calc(14px / var(--s-edit, 1)), 28px); }
  .cap .cc.empty { color: var(--cap-sub); font-weight: 400; }
  .cap { white-space: normal; overflow: hidden; }
  .cap .cc { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 3; overflow: hidden; word-break: break-all; }
  .cap .cc.long { font-size: clamp(12px, calc(11px / var(--s-edit, 1)), 22px); }
  .cap .cc.flash { animation: ccin .35s cubic-bezier(.2, .8, .2, 1); }
  @keyframes ccin { from { opacity: 0; transform: translateY(6px); } }
  /* 切换预设：5 个键依次按下弹起，像在"装载"新键位 */
  .kb.wave .key3d { animation: wave .55s cubic-bezier(.3, 1.5, .5, 1) both; animation-delay: calc(var(--i) * 70ms); }
  @keyframes wave { 35% { transform: translateZ(-12px); } }
  .kb.wave .oled .scr { animation: flick .4s steps(2) 1; }
  @keyframes flick { 50% { opacity: .25; } }

  /* ---------------------------------------------------------------- 首页文字 */
  .intro { position: absolute; left: 0; right: 0; bottom: 8%; text-align: center; display: grid; justify-items: center;
           gap: 14px; padding: 0 24px; transition: opacity .45s, transform .6s; }
  .intro h2 { margin: 0; font-size: 22px; }
  .intro p { margin: 0; color: var(--muted); max-width: 470px; }
  [data-view=edit] .intro { opacity: 0; transform: translateY(20px); pointer-events: none; }

  /* ---------------------------------------------------------------- 底部工具条（编辑视角才出现） */
  .dock { position: absolute; left: 50%; bottom: 18px; transform: translate(-50%, 16px); opacity: 0; pointer-events: none;
          display: flex; align-items: center; gap: 4px; padding: 5px; border-radius: 14px;
          background: var(--glass); border: 1px solid var(--line); box-shadow: var(--pop-shadow);
          backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
          transition: opacity .4s, transform .5s; max-width: calc(100% - 24px); overflow-x: auto; }
  [data-view=edit] .dock { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; transition-delay: .7s; }
  .dock button { height: 32px; padding: 0 12px; font-size: 13px; }
  .dock .sep { width: 1px; height: 18px; background: var(--line-strong); margin: 0 4px; flex: none; }
  .hint { position: absolute; left: 0; right: 0; top: 18px; text-align: center; font-size: 13px; color: var(--muted);
          opacity: 0; transition: opacity .5s; pointer-events: none; }
  [data-view=edit] .hint { opacity: 1; transition-delay: 1s; }
  .hint kbd { font: 12px var(--mono); padding: 1px 6px; border-radius: 4px; border: 1px solid var(--line-strong); background: var(--glass); }

  /* ---------------------------------------------------------------- 键帽旁的小卡片 */
  .pop { position: absolute; left: 0; top: 0; z-index: 20; width: 330px; padding: 12px;
         border-radius: 14px; background: var(--panel); border: 1px solid var(--line); box-shadow: var(--pop-shadow);
         display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px; opacity: 0; scale: .95; transform-origin: var(--ax, 50%) 0;
         transition: opacity .28s ease, scale .38s cubic-bezier(.2, .9, .3, 1.15), transform .45s cubic-bezier(.2, .8, .2, 1),
                     width .3s ease; }
  .pop.show { opacity: 1; scale: 1; }
  .pop.above { transform-origin: var(--ax, 50%) 100%; }
  .pop.snap { transition: opacity .28s ease, scale .38s cubic-bezier(.2, .9, .3, 1.15); }
  .pop::before { content: ""; position: absolute; left: var(--ax, 50%); top: -7px; width: 12px; height: 12px; margin-left: -6px;
                 background: var(--panel); border-left: 1px solid var(--line); border-top: 1px solid var(--line);
                 transform: rotate(45deg); }
  .pop.above::before { top: auto; bottom: -7px; transform: rotate(225deg); }
  .pop-head { display: flex; align-items: center; gap: 10px; }
  .pop-head .pk { font: 700 13px var(--mono); padding: 2px 8px; border-radius: 6px; background: var(--sunken);
                  border: 1px solid var(--line-strong); border-bottom-width: 3px; }
  .pop-head { align-items: flex-start; }
  .pop-head .pk, .pop-head .x { flex: none; }
  .pop-head b { flex: 1; min-width: 0; font: 600 15px/1.45 var(--mono); padding-top: 1px; overflow-wrap: anywhere; }
  .pop-head b.empty { color: var(--faint); font-weight: 400; }
  .pop-head .x { width: 28px; height: 28px; padding: 0; border-color: transparent; background: transparent; color: var(--muted); font-size: 18px; }

<script>
"use strict";

// ====================================================================== 常量
const PRESET_COUNT_DEFAULT = 5;
const KEY_COUNT = 5;
const NAME_MAX = 19, DESC_MAX = 15;
const ESPRESSIF_VID = 0x303A;

const MODS = [
  { bit: 0x01, label: "Ctrl" },
  { bit: 0x02, label: "Shift" },
  { bit: 0x04, label: "Alt" },
  { bit: 0x08, label: "Win" },
];

// HID 键码（Keyboard/Keypad Page）。固件的报告描述符只接受 0x00..0x65。
// [键码, 显示名, 屏幕说明用的 ASCII 名]
const KEYS = [
  [0x00, "（无）", ""],
  ...Array.from({ length: 26 }, (_, i) => [0x04 + i, String.fromCharCode(65 + i), String.fromCharCode(65 + i)]),
  ...Array.from({ length: 9 }, (_, i) => [0x1E + i, String(i + 1), String(i + 1)]),
  [0x27, "0", "0"],
  [0x28, "Enter", "Enter"], [0x29, "Esc", "Esc"], [0x2A, "Backspace", "Bksp"], [0x2B, "Tab", "Tab"],
  [0x2C, "空格", "Space"], [0x2D, "-", "-"], [0x2E, "=", "="], [0x2F, "[", "["], [0x30, "]", "]"],
  [0x31, "\\", "\\"], [0x33, ";", ";"], [0x34, "'", "'"], [0x35, "`", "`"], [0x36, ",", ","],
  [0x37, ".", "."], [0x38, "/", "/"], [0x39, "CapsLock", "Caps"],
  ...Array.from({ length: 12 }, (_, i) => [0x3A + i, "F" + (i + 1), "F" + (i + 1)]),
  [0x46, "PrintScreen", "PrtSc"], [0x47, "ScrollLock", "ScrLk"], [0x48, "Pause", "Pause"],
  [0x49, "Insert", "Ins"], [0x4A, "Home", "Home"], [0x4B, "PageUp", "PgUp"], [0x4C, "Delete", "Del"],
  [0x4D, "End", "End"], [0x4E, "PageDown", "PgDn"],
  [0x4F, "→", "Right"], [0x50, "←", "Left"], [0x51, "↓", "Down"], [0x52, "↑", "Up"],
  [0x53, "NumLock", "NumLk"], [0x54, "小键盘 /", "Num/"], [0x55, "小键盘 *", "Num*"],
  [0x56, "小键盘 -", "Num-"], [0x57, "小键盘 +", "Num+"], [0x58, "小键盘 Enter", "NumEnt"],
  ...Array.from({ length: 9 }, (_, i) => [0x59 + i, "小键盘 " + (i + 1), "Num" + (i + 1)]),
  [0x62, "小键盘 0", "Num0"], [0x63, "小键盘 .", "Num."], [0x65, "菜单键", "Menu"],
];
const KEY_BY_CODE = new Map(KEYS.map(k => [k[0], k]));

// 浏览器 KeyboardEvent.code -> HID 键码（录制用）
const CODE_TO_HID = (() => {
  const m = {};
  for (let i = 0; i < 26; i++) m["Key" + String.fromCharCode(65 + i)] = 0x04 + i;
  for (let i = 1; i <= 9; i++) m["Digit" + i] = 0x1D + i;
  m.Digit0 = 0x27;
  Object.assign(m, {
    Enter: 0x28, Escape: 0x29, Backspace: 0x2A, Tab: 0x2B, Space: 0x2C, Minus: 0x2D, Equal: 0x2E,
    BracketLeft: 0x2F, BracketRight: 0x30, Backslash: 0x31, Semicolon: 0x33, Quote: 0x34,
    Backquote: 0x35, Comma: 0x36, Period: 0x37, Slash: 0x38, CapsLock: 0x39,
    PrintScreen: 0x46, ScrollLock: 0x47, Pause: 0x48, Insert: 0x49, Home: 0x4A, PageUp: 0x4B,
    Delete: 0x4C, End: 0x4D, PageDown: 0x4E, ArrowRight: 0x4F, ArrowLeft: 0x50, ArrowDown: 0x51,
    ArrowUp: 0x52, NumLock: 0x53, NumpadDivide: 0x54, NumpadMultiply: 0x55, NumpadSubtract: 0x56,
    NumpadAdd: 0x57, NumpadEnter: 0x58, Numpad0: 0x62, NumpadDecimal: 0x63, ContextMenu: 0x65,
  });
  for (let i = 1; i <= 12; i++) m["F" + i] = 0x39 + i;
  for (let i = 1; i <= 9; i++) m["Numpad" + i] = 0x58 + i;
  return m;
})();

// 媒体键：16 位位图，与固件 Hid2Ble.cpp 的 Consumer 报告描述符顺序一致
const MEDIA = [
  [0x0000, "（无）", ""],
  [0x0020, "音量 +", "Volume +"], [0x0040, "音量 −", "Volume -"], [0x0010, "静音", "Mute"],
  [0x0008, "播放 / 暂停", "Play/Pause"], [0x0001, "下一曲", "Next Track"], [0x0002, "上一曲", "Prev Track"],
  [0x0004, "停止", "Stop"], [0x0080, "浏览器主页", "Web Home"], [0x2000, "浏览器后退", "Web Back"],
  [0x0800, "浏览器搜索", "Web Search"], [0x0400, "收藏夹", "Favorites"], [0x0200, "计算器", "Calculator"],
  [0x0100, "我的电脑", "My Computer"], [0x8000, "邮件", "Mail"], [0x4000, "媒体播放器", "Media"],
];
const MEDIA_BY_CODE = new Map(MEDIA.map(m => [m[0], m]));

// ====================================================================== 状态
let port = null, reader = null, writer = null, readDone = null;
let presets = [];          // [{ name, media, keys: [{ mod, k1, k2, media, desc, descAuto }] }]
let devicePresets = [];    // 最近一次从键盘读到 / 写入的版本，用来判断"未写入"
let presetCount = PRESET_COUNT_DEFAULT;
let currentOnDevice = -1;
let active = 0;
let recording = -1;        // 正在录制的键号

const $ = id => document.getElementById(id);
const logEl = $("log");

function log(line, dir) {
  const prefix = dir === "tx" ? "→ " : dir === "rx" ? "← " : "   ";
  logEl.textContent += prefix + line + "\n";
  if (logEl.textContent.length > 60000) logEl.textContent = logEl.textContent.slice(-40000);
  logEl.scrollTop = logEl.scrollHeight;
}

let noticeTimer = 0;
function notice(text, kind = "warn") {
  clearTimeout(noticeTimer);
  const box = $("notice");
  box.innerHTML = "";
  if (!text) return;
  const n = document.createElement("div");
  n.className = "notice " + kind;
  n.setAttribute("role", kind === "err" ? "alert" : "status");
  n.textContent = text;
  const close = () => { n.classList.add("hide"); setTimeout(() => n.remove(), 250); };
  n.onclick = close;
  box.appendChild(n);
  if (kind === "ok") noticeTimer = setTimeout(close, 4000);   // 错误 / 警告留着，点一下才关
}

// ====================================================================== 串口
let rxBuf = "";
let waiter = null;
let queue = Promise.resolve();

async function connect() {
  if (!("serial" in navigator)) {
    notice("这个浏览器不支持 Web Serial。请用电脑版 Chrome 或 Edge 打开本页面。", "err");
    return;
  }
  try {
    port = await navigator.serial.requestPort({ filters: [{ usbVendorId: ESPRESSIF_VID }] });
  } catch (e) {
    return;   // 用户取消了选择
  }
  try {
    await port.open({ baudRate: 115200 });
  } catch (e) {
    notice("打不开串口：" + e.message + "。如果 PlatformIO 串口监视器或其它程序正占用这个串口，请先关掉它。", "err");
    port = null;
    return;
  }
  // 把 DTR/RTS 拉低：ESP32-C3 的 USB-Serial/JTAG 会把这两根线当成复位 / 下载模式控制
  try { await port.setSignals({ dataTerminalReady: false, requestToSend: false }); } catch (e) {}

  writer = port.writable.getWriter();
  readDone = readLoop();
  setConnected(true);

  try {
    let hello = null;
    for (let i = 0; i < 3 && !hello; i++) {
      try { hello = await request("HELLO", l => l.startsWith("@HELLO") ? l : undefined, 1500); }
      catch (e) { /* 刚上电或刚复位，再试一次 */ }
    }
    if (!hello) throw new Error("键盘没有回应。请确认已经烧录了支持改键的固件（串口输入 ? 时帮助里有 @... 一行）。");
    const parts = hello.split(/\s+/);
    presetCount = parseInt(parts[3], 10) || PRESET_COUNT_DEFAULT;
    currentOnDevice = parseInt(parts[5], 10);
    await readFromDevice();
    notice("");
  } catch (e) {
    notice(e.message, "err");
  }
}

async function disconnect() {
  // 先停读取循环并等它真正退出（port.readable 解锁后 close() 才能成功）
  try { if (reader) await reader.cancel(); } catch (e) {}
  try { if (readDone) await readDone; } catch (e) {}
  try { if (writer) { writer.releaseLock(); } } catch (e) {}
  try { if (port) await port.close(); } catch (e) {}
  port = reader = writer = null;
  // 断开后回到首页：页面上的预设只是键盘数据的副本，不清掉会让人以为还连着
  presets = []; devicePresets = [];
  active = 0; selKey = -1; recording = -1;
  setConnected(false);
}

async function readLoop() {
  const decoder = new TextDecoderStream();
  const closed = port.readable.pipeTo(decoder.writable).catch(() => {});
  reader = decoder.readable.getReader();
  try {
    for (;;) {
      const { value, done } = await reader.read();
      if (done) break;
      rxBuf += value;
      let nl;
      while ((nl = rxBuf.indexOf("\n")) >= 0) {
        const line = rxBuf.slice(0, nl).replace(/\r$/, "");
        rxBuf = rxBuf.slice(nl + 1);
        onLine(line);
      }
    }
  } catch (e) {
    log("读取出错：" + e.message);
  } finally {
    reader.releaseLock();
    await closed;
  }
}

function onLine(line) {
  if (!line) return;
  log(line, "rx");
  if (line.startsWith("@") && waiter) waiter(line);
}

async function sendLine(text) {
  log(text, "tx");
  await writer.write(new TextEncoder().encode(text + "\n"));
}

// 发一条命令，handler 对每行 '@' 回复返回 undefined 表示继续等，返回其它值表示完成
function request(cmd, handler, timeout = 4000) {
  const run = () => new Promise((resolve, reject) => {
    const timer = setTimeout(() => { waiter = null; reject(new Error("等待回复超时：" + cmd)); }, timeout);
    waiter = line => {
      if (line.startsWith("@ERR")) {
        clearTimeout(timer); waiter = null;
        reject(new Error("键盘返回错误：" + line.slice(5)));
        return;
      }
      const r = handler(line);
      if (r !== undefined) { clearTimeout(timer); waiter = null; resolve(r); }
    };
    sendLine("@" + cmd).catch(e => { clearTimeout(timer); waiter = null; reject(e); });
  });
  const p = queue.then(run, run);
  queue = p.catch(() => {});
  return p;
}

// ====================================================================== 编解码
const hexOfBytes = bytes => Array.from(bytes, b => b.toString(16).padStart(2, "0")).join("").toUpperCase();
const bytesOfHex = hex => Uint8Array.from(hex.match(/../g) || [], h => parseInt(h, 16));
const strToHex = s => s.length ? hexOfBytes(Array.from(s, c => c.charCodeAt(0))) : "-";
const hexToStr = h => h === "-" ? "" : String.fromCharCode(...bytesOfHex(h));
const isAscii = s => /^[\x20-\x7E]*$/.test(s);

function parsePresetLine(line) {
  // @P i media keys name d1..d5
  const t = line.split(" ");
  if (t.length !== 10) throw new Error("看不懂的回复：" + line);
  const media = t[2] === "1";
  const bytes = bytesOfHex(t[3]);
  const keys = [];
  for (let k = 0; k < KEY_COUNT; k++) {
    const b = bytes.slice(k * 8, k * 8 + 8);
    keys.push({
      mod: media ? 0 : b[0], k1: media ? 0 : b[2], k2: media ? 0 : b[3],
      media: media ? (b[0] | (b[1] << 8)) : 0,
      desc: hexToStr(t[5 + k]), descAuto: false,
    });
  }
  return { index: parseInt(t[1], 10), preset: { name: hexToStr(t[4]), media, keys } };
}

function presetToCommand(i, p) {
  const bytes = [];
  for (const k of p.keys) {
    if (p.media) bytes.push(k.media & 0xFF, (k.media >> 8) & 0xFF, 0, 0, 0, 0, 0, 0);
    else         bytes.push(k.mod, 0, k.k1, k.k2, 0, 0, 0, 0);
  }
  return ["SET", i, p.media ? 1 : 0, hexOfBytes(bytes), strToHex(p.name),
          ...p.keys.map(k => strToHex(k.desc))].join(" ");
}

const clone = o => JSON.parse(JSON.stringify(o));
const samePreset = (a, b) => JSON.stringify(stripAuto(a)) === JSON.stringify(stripAuto(b));
function stripAuto(p) {
  if (!p) return p;
  const c = clone(p);
  c.keys.forEach(k => delete k.descAuto);
  return c;
}

// ====================================================================== 与键盘交互
async function readFromDevice() {
  const list = [];
  await request("GET", line => {
    if (line.startsWith("@P ")) { list.push(parsePresetLine(line)); return undefined; }
    if (line === "@END") return true;
    return undefined;
  });
  presets = [];
  for (const { index, preset } of list) presets[index] = preset;
  devicePresets = clone(presets);
  if (active >= presets.length) active = 0;
  render();
}

async function writeToDevice() {
  const problems = validate();
  if (problems.length) { notice("还不能写入：" + problems.join("；"), "err"); return; }
  const btn = $("btnWrite");
  const changed = dirtyCount();
  setBusy(true);
  btn.classList.add("busy");
  let ok = false;
  try {
    for (let i = 0; i < presets.length; i++) {
      btn.textContent = `写入中 ${i + 1}/${presets.length}`;
      await request(presetToCommand(i, presets[i]), l => l === "@OK SET " + i ? true : undefined);
    }
    btn.textContent = "保存中…";
    await request("SAVE", l => l === "@OK SAVE" ? true : undefined, 6000);
    devicePresets = clone(presets);
    ok = true;
    notice(changed ? `已写入 ${changed} 组改动并保存到键盘，断电后也会保留。`
                   : "没有新改动，已把当前设置重新写入键盘。", "ok");
  } catch (e) {
    notice("写入失败：" + e.message, "err");
  } finally {
    btn.classList.remove("busy");
    setBusy(false);
    render();
    if (ok) {
      btn.classList.add("done");
      btn.textContent = "✓ 已写入";
      setTimeout(() => { btn.classList.remove("done"); updateWriteButton(); }, 2000);
    }
  }
}

async function resetDevice() {
  if (!confirm("把键盘上的 5 组预设恢复成出厂设置？你在键盘上保存过的改动会被清除。")) return;
  setBusy(true);
  try {
    await request("RESET", l => l === "@OK RESET" ? true : undefined);
    await readFromDevice();
    notice("已恢复出厂预设。", "ok");
  } catch (e) {
    notice(e.message, "err");
  } finally { setBusy(false); }
}

async function useOnDevice() {
  try {
    await request("USE " + active, l => l === "@OK USE " + active ? true : undefined);
    currentOnDevice = active;
    render();
    if (!samePreset(presets[active], devicePresets[active])) {
      notice("已切换到这组预设。注意：这组有改动还没写入，键盘上用的是写入前的版本。", "warn");
    } else {
      notice("键盘已切换到这组预设。", "ok");
    }
  } catch (e) { notice(e.message, "err"); }
}

// ====================================================================== 校验 / 显示文字
function comboText(p, k) {
  if (p.media) return k.media ? (MEDIA_BY_CODE.get(k.media) || [0, "未知媒体键"])[1] : "";
  const parts = MODS.filter(m => k.mod & m.bit).map(m => m.label);
  for (const c of [k.k1, k.k2]) if (c) parts.push((KEY_BY_CODE.get(c) || [c, "0x" + c.toString(16)])[1]);
  return parts.join(" + ");
}

// 屏幕上的说明只能是 ASCII，最多 15 个字符
function autoDesc(p, k) {
  let s;
  if (p.media) s = (MEDIA_BY_CODE.get(k.media) || [0, "", ""])[2];
  else {
    const parts = MODS.filter(m => k.mod & m.bit).map(m => m.label);
    for (const c of [k.k1, k.k2]) if (c) parts.push((KEY_BY_CODE.get(c) || [c, "", "?"])[2]);
    s = parts.join("+");
  }
  return s.slice(0, DESC_MAX);
}

function validate() {
  const out = [];
  presets.forEach((p, i) => {
    const tag = `第 ${i + 1} 组`;
    if (!isAscii(p.name)) out.push(`${tag}的预设名只能用英文、数字和符号`);
    if (p.name.length > NAME_MAX) out.push(`${tag}的预设名超过 ${NAME_MAX} 个字符`);
    p.keys.forEach((k, j) => {
      if (!isAscii(k.desc)) out.push(`${tag} K${j + 1} 的说明只能用英文、数字和符号`);
      if (k.desc.length > DESC_MAX) out.push(`${tag} K${j + 1} 的说明超过 ${DESC_MAX} 个字符`);
    });
  });
  return out;
}



// ====================================================================== 界面：全部在 3D 模型上完成
let selKey = -1;           // 当前打开小卡片的键
const KB_W = 900, KB_H = 300;
let lastBoardPreset = -1;

const el = (tag, cls, text) => {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
};
const isField = t => t && (t.tagName === "INPUT" || t.tagName === "SELECT" || t.tagName === "TEXTAREA");
const dirtyCount = () => presets.filter((p, i) => !samePreset(p, devicePresets[i])).length;

function setConnected(on) {
  $("dot").classList.toggle("on", on);
  $("statusText").textContent = on ? "已连接" : "未连接";
  $("btnConnect").textContent = on ? "断开" : "连接键盘";
  $("btnConnect").classList.toggle("primary", !on);
  ["btnRead", "btnWrite", "btnUse", "btnReset"].forEach(id => $(id).disabled = !on);
  if (!on) currentOnDevice = -1;
  render();
}

function setBusy(b) {
  ["btnRead", "btnWrite", "btnUse", "btnReset", "btnConnect"].forEach(id => $(id).disabled = b || (id !== "btnConnect" && !port));
}

function updateWriteButton() {
  const btn = $("btnWrite");
  if (btn.classList.contains("busy") || btn.classList.contains("done")) return;
  const n = dirtyCount();
  btn.textContent = "写入键盘";
  btn.title = n ? `有 ${n} 组预设改动还没写入键盘` : "";
  if (n) btn.appendChild(el("span", "pending", n));
}

function render() {
  const p = presets[active];
  const view = p ? "edit" : "home";
  const viewChanged = document.body.dataset.view !== view;
  if (viewChanged) {
    document.body.dataset.view = view;
    $("kb").style.transitionDuration = "";          // 连接 / 断开：完整的镜头转场
    layoutStage();
  }
  if (!p) { selKey = -1; recording = -1; }
  const sel = !!p && selKey >= 0;
  if (document.body.hasAttribute("data-sel") !== sel) {
    // 选中 / 取消选中键：镜头移动快一些
    if (!viewChanged) $("kb").style.transitionDuration = ".65s";
    document.body.toggleAttribute("data-sel", sel);
    camMoving = true;                               // 镜头移到位（transitionend）后卡片再出现
  }
  renderBoard(p);
  renderPop();
  updateWriteButton();
  $("btnUse").textContent = p && active === currentOnDevice ? "已是键盘当前预设" : "设为键盘当前预设";
}

// 只刷新"未写入"标记（打字时不重画整个模型）
function renderTabsOnly() {
  $("board").querySelectorAll(".pad").forEach((b, i) => b.classList.toggle("dirty", !samePreset(presets[i], devicePresets[i])));
  updateWriteButton();
}

// ====================================================================== 3D 模型
// 模型只建一次：元素一直在，选中 / 按下 / 切换才有过渡动画
function buildKeyboard() {
  const board = $("board");
  board.innerHTML = "";

  // 外壳左上：5 个预设圆钮 + 类型拨动开关
  const deck = el("div", "deck");
  const padsWrap = el("div");
  padsWrap.appendChild(el("div", "deck-label", "PRESET"));
  const pads = el("div", "pads");
  for (let i = 0; i < PRESET_COUNT_DEFAULT; i++) {
    const b = el("button", "pad", i + 1);
    b.onclick = () => {
      if (!presets[i] || i === active) return;
      finishNameEdit();
      active = i; selKey = -1; recording = -1;
      render();
    };
    pads.appendChild(b);
  }
  padsWrap.appendChild(pads);
  const flipWrap = el("div");
  flipWrap.appendChild(el("div", "deck-label", "MODE"));
  const flip = el("div", "flip");
  for (const [type, label] of [["kbd", "KEYS"], ["media", "MEDIA"]]) {
    const b = el("button", "", label);
    b.dataset.type = type;
    b.title = type === "kbd" ? "普通快捷键" : "媒体键（音量、播放等）";
    b.onclick = () => setType(type === "media");
    flip.appendChild(b);
  }
  flipWrap.appendChild(flip);
  deck.append(padsWrap, flipWrap);
  board.appendChild(deck);

  // OLED：第一行预设名（点击可改），第二行选中键的屏幕说明
  const oled = el("div", "oled");
  const scr = el("div", "scr");
  const l1 = el("div", "ln"), l2 = el("div", "ln");
  const oname = el("span", "oname");
  oname.title = "点击修改预设名";
  oname.onclick = startNameEdit;
  l1.append(el("span", "bat"), oname, el("span", "r", "BT"));
  l2.append(el("span", "odesc"), el("span", "r oidx"));
  scr.append(l1, l2);
  oled.appendChild(scr);
  board.appendChild(oled);

  // 5 个立体键帽
  for (let j = 0; j < KEY_COUNT; j++) {
    const key = el("div", "key3d");
    key.style.setProperty("--i", j);
    key.appendChild(el("span", "well"));
    for (const f of ["f", "b", "l", "r"]) key.appendChild(el("span", "ks " + f));
    const cap = el("button", "cap");
    cap.append(el("span", "kn", "K" + (j + 1)), el("span", "cc"));
    cap.onclick = () => selectKey(j);
    key.appendChild(cap);
    board.appendChild(key);
  }
}

function renderBoard(p) {
  const board = $("board");
  const keys = [...board.querySelectorAll(".key3d")];
  const kb = $("kb");
  if (!p) {
    lastBoardPreset = -1;
    keys.forEach(key => {
      key.className = "key3d";
      key.querySelector(".cc").textContent = "";
      key.querySelector(".cap").title = "";
    });
    board.querySelector(".oname").textContent = "Keybrick";
    const d = board.querySelector(".odesc");
    d.innerHTML = "";
    d.append(port ? "reading" : "connect USB", el("span", "blink", "_"));
    board.querySelector(".oidx").textContent = "";
    setFocusAngle(-1);
    return;
  }
  // 换了预设（不是刚连上）就让键帽依次按一遍
  if (lastBoardPreset >= 0 && lastBoardPreset !== active) {
    kb.classList.remove("wave"); void kb.offsetWidth; kb.classList.add("wave");
    clearTimeout(renderBoard.t); renderBoard.t = setTimeout(() => kb.classList.remove("wave"), 1000);
  }
  lastBoardPreset = active;

  board.querySelectorAll(".pad").forEach((b, i) => {
    b.hidden = i >= presets.length;
    b.classList.toggle("on", i === active);
    b.classList.toggle("dirty", !!presets[i] && !samePreset(presets[i], devicePresets[i]));
    b.classList.toggle("cur", i === currentOnDevice);
    const nm = presets[i] ? presets[i].name || "（未命名）" : "";
    b.title = `预设 ${i + 1}：${nm}` + (i === currentOnDevice ? "（键盘当前使用）" : "") +
              (presets[i] && !samePreset(presets[i], devicePresets[i]) ? "，有改动未写入" : "");
  });
  board.querySelectorAll(".flip button").forEach(b => b.classList.toggle("on", (b.dataset.type === "media") === p.media));

  const waving = kb.classList.contains("wave");
  // 键帽上用紧凑写法（不带空格、长键名用缩写），放得下更多
  const capText = k => {
    if (p.media) return comboText(p, k);
    const parts = MODS.filter(m => k.mod & m.bit).map(m => m.label);
    for (const c of [k.k1, k.k2]) if (c) parts.push((KEY_BY_CODE.get(c) || [c, "", "0x" + c.toString(16)])[2]);
    return parts.join("+");
  };
  keys.forEach((key, j) => {
    const k = p.keys[j];
    const text = capText(k);
    key.className = "key3d" + (selKey === j ? " sel" : "") + (recording === j ? " recording" : "");
    const cc = key.querySelector(".cc");
    if (!waving && cc.textContent && cc.textContent !== (text || "未设置")) {
      cc.classList.remove("flash"); void cc.offsetWidth; cc.classList.add("flash");
    }
    cc.textContent = text || "未设置";
    cc.classList.toggle("empty", !text);
    cc.classList.toggle("long", text.length > 12);
    key.querySelector(".cap").title = (comboText(p, k) || "未设置") + (k.desc ? "\n屏幕显示：" + k.desc : "");
  });
  if (!board.querySelector(".oname-in")) board.querySelector(".oname").textContent = p.name || "(no name)";
  board.querySelector(".oidx").textContent = `${active + 1}/${presets.length}`;
  updateOled();
  setFocusAngle(selKey);
}

// OLED 第二行：选中键的屏幕说明（没选中时显示 K1 的）
function updateOled() {
  const p = presets[active], d = $("board").querySelector(".odesc");
  if (!p || !d) return;
  const j = selKey >= 0 ? selKey : 0;
  d.textContent = `K${j + 1} ${p.keys[j].desc || "-"}`;
}

// 选中某个键时，镜头往那个键稍微转一点
function setFocusAngle(j) {
  const narrow = $("stage").clientWidth <= 760;
  $("stage").style.setProperty("--fy", j >= 0 && !narrow ? `${(2 - j) * 3}deg` : "0deg");
}

// 按舞台尺寸算模型缩放和位置
function layoutStage() {
  const st = $("stage");
  const w = st.clientWidth, h = st.clientHeight;
  const sEdit = Math.max(.36, Math.min(1.3, (w - 56) / (KB_W * 1.02), (h * .56) / KB_H));
  const sSel = Math.max(.36, Math.min(sEdit, (h * .34) / KB_H));
  const sHome = Math.max(.32, Math.min(.72, (w - 24) / (KB_W * 1.05), (h * .5) / 330));
  st.style.setProperty("--s-edit", sEdit.toFixed(3));
  st.style.setProperty("--s-home", sHome.toFixed(3));
  st.style.setProperty("--s-sel", sSel.toFixed(3));
  // 编辑视角：模型放在偏上的位置，给下方的小卡片留地方；窄屏卡片贴底，模型再往上一点
  const narrow = w <= 760;
  st.style.setProperty("--ky-edit", Math.round(-h * (narrow ? .06 : .02)) + "px");
  st.style.setProperty("--ky-sel", Math.round(-h * (narrow ? .25 : .22)) + "px");
  st.style.setProperty("--ky-home", Math.round(-h * .1) + "px");
  placePop();
}

// ====================================================================== 预设名：直接在 OLED 上改
function startNameEdit() {
  const p = presets[active];
  if (!p) return;
  const span = $("board").querySelector(".oname");
  if (!span || span.querySelector(".oname-in")) return;
  const inp = el("input", "oname-in");
  inp.value = p.name;
  inp.maxLength = NAME_MAX;
  inp.spellcheck = false;
  inp.setAttribute("aria-label", "预设名（显示在屏幕上，英文）");
  span.textContent = "";
  span.appendChild(inp);
  inp.focus();
  inp.select();
  inp.oninput = () => {
    p.name = inp.value;
    inp.classList.toggle("bad", !isAscii(inp.value));
    renderTabsOnly();
  };
  inp.onkeydown = e => {
    if (e.key === "Enter" || e.key === "Escape") { e.preventDefault(); inp.blur(); }
    e.stopPropagation();
  };
  inp.onblur = finishNameEdit;
  if (!isAscii(p.name)) inp.classList.add("bad");
}

function finishNameEdit() {
  const inp = $("board").querySelector(".oname-in");
  if (!inp) return;
  inp.onblur = null;
  const p = presets[active];
  if (p && !isAscii(p.name)) notice("预设名只能用英文、数字和符号（屏幕显示不了中文）。", "warn");
  inp.parentElement.textContent = p ? p.name || "(no name)" : "";
  renderTabsOnly();
}

// ====================================================================== 类型切换（外壳上的拨动开关）
function setType(media) {
  const p = presets[active];
  if (!p || media === p.media) return;
  if (!confirm("切换类型会清空这组 5 个键的设置。继续？")) return;
  p.media = media;
  p.keys = p.keys.map(() => ({ mod: 0, k1: 0, k2: 0, media: 0, desc: "", descAuto: true }));
  selKey = -1; recording = -1;
  render();
}

// ====================================================================== 键帽 + 小卡片
function selectKey(j) {
  const p = presets[active];
  if (!p) return;
  finishNameEdit();
  if (selKey === j) { closePop(); return; }
  selKey = j;
  recording = p.media ? -1 : j;     // 快捷键模式：一打开就在监听，直接按组合键
  render();
}

function closePop() {
  if (selKey < 0) return;
  selKey = -1; recording = -1;
  render();
}

function stopRecording() { if (recording >= 0) { recording = -1; render(); } }

// 卡片里的固定元素只建一次
function buildPop() {
  const mods = $("popMods");
  for (const m of MODS) {
    const b = el("button", "", m.label);
    b.dataset.bit = m.bit;
    b.onclick = () => {
      const p = presets[active], k = p && p.keys[selKey];
      if (!k) return;
      k.mod ^= m.bit; recording = -1; touchDesc(p, k); render();
    };
    mods.appendChild(b);
  }
  for (const id of ["popK1", "popK2"]) {
    const sel = $(id);
    for (const [code, label] of KEYS) sel.add(new Option(label, code));
    sel.onchange = () => {
      const p = presets[active], k = p && p.keys[selKey];
      if (!k) return;
      k[id === "popK1" ? "k1" : "k2"] = parseInt(sel.value, 10);
      touchDesc(p, k); render();
    };
  }
  const grid = $("popMedia");
  for (const [code, label] of MEDIA) {
    const b = el("button", "", label);
    b.dataset.code = code;
    b.onclick = () => {
      const p = presets[active], k = p && p.keys[selKey];
      if (!k) return;
      k.media = code; touchDesc(p, k); render();
    };
    grid.appendChild(b);
  }
  $("popRec").onclick = () => { recording = recording === selKey ? -1 : selKey; render(); };
  $("popClose").onclick = closePop;
  const desc = $("popDesc");
  desc.maxLength = DESC_MAX;
  desc.oninput = () => {
    const p = presets[active], k = p && p.keys[selKey];
    if (!k) return;
    k.desc = desc.value; k.descAuto = false;
    $("popCount").textContent = `${desc.value.length}/${DESC_MAX}`;
    desc.classList.toggle("bad", !isAscii(desc.value));
    updateOled(); renderTabsOnly();
    const cap = $("board").querySelectorAll(".cap")[selKey];
    if (cap) cap.title = comboText(p, k) + (k.desc ? "\n屏幕显示：" + k.desc : "");
  };
  // 在卡片里点输入框 / 下拉框时停止监听，免得打字被当成组合键
  $("pop").addEventListener("focusin", e => { if (isField(e.target) && recording >= 0) stopRecording(); });
}

let popHideTimer = 0, popShowTimer = 0, camMoving = false, pendingShow = null;
$("kb").addEventListener("transitionend", e => {
  if (e.target !== $("kb") || e.propertyName !== "transform") return;
  camMoving = false;
  if (pendingShow) { const f = pendingShow; pendingShow = null; clearTimeout(popShowTimer); f(); }
});
function hidePop() {
  const pop = $("pop");
  if (pop.hidden || !pop.classList.contains("show")) return;
  pop.classList.remove("show");
  clearTimeout(popHideTimer);
  popHideTimer = setTimeout(() => { if (!pop.classList.contains("show")) pop.hidden = true; }, 320);
}

function renderPop() {
  const pop = $("pop");
  const p = presets[active], k = p && selKey >= 0 ? p.keys[selKey] : null;
  if (!k) { clearTimeout(popShowTimer); pendingShow = null; hidePop(); return; }
  const wasHidden = pop.hidden || !pop.classList.contains("show");
  clearTimeout(popHideTimer);
  $("popKey").textContent = "K" + (selKey + 1);
  const text = comboText(p, k);
  $("popCombo").textContent = text || "未设置";
  $("popCombo").classList.toggle("empty", !text);
  $("popKbd").hidden = p.media;
  $("popMedia").hidden = !p.media;
  pop.classList.toggle("media", p.media);
  if (p.media) {
    $("popMedia").querySelectorAll("button").forEach(b => b.classList.toggle("on", +b.dataset.code === k.media));
  } else {
    const rec = $("popRec");
    rec.classList.toggle("on", recording === selKey);
    rec.textContent = recording === selKey ? "正在监听，直接按下组合键…" : "点这里录制组合键";
    $("popMods").querySelectorAll("button").forEach(b => b.classList.toggle("on", !!(k.mod & +b.dataset.bit)));
    for (const [id, which] of [["popK1", "k1"], ["popK2", "k2"]]) {
      const sel = $(id);
      [...sel.options].filter(o => o.dataset.extra).forEach(o => o.remove());
      if (k[which] && !KEY_BY_CODE.has(k[which])) {
        const o = new Option("0x" + k[which].toString(16), k[which]); o.dataset.extra = "1"; sel.add(o);
      }
      sel.value = k[which];
    }
  }
  const desc = $("popDesc");
  if (document.activeElement !== desc) desc.value = k.desc;
  $("popCount").textContent = `${desc.value.length}/${DESC_MAX}`;
  desc.classList.toggle("bad", !isAscii(desc.value));
  if (wasHidden) {
    clearTimeout(popShowTimer);
    const showNow = () => {
      if (selKey < 0 || !presets[active]) return;
      // 先不带位移过渡地放到位（这时决定放键帽上方还是下方），再淡入，避免从角落飞过来
      pop.hidden = false;
      pop.classList.add("snap");
      placePop(true);
      void pop.offsetWidth;
      setTimeout(() => { pop.classList.remove("snap"); pop.classList.add("show"); }, 20);
      followPop();
    };
    if (camMoving) {
      pendingShow = showNow;
      popShowTimer = setTimeout(() => { pendingShow = null; camMoving = false; showNow(); }, 1100);   // 兜底
    } else showNow();
  } else {
    followPop();
  }
}

// 卡片跟着键帽走：放在键帽下方，放不下就放上方
function placePop(decide = false) {
  const pop = $("pop");
  if (pop.hidden || selKey < 0) return;
  const st = $("stage");
  if (st.clientWidth <= 760) { pop.style.transform = ""; return; }
  // 键帽可见范围 = 顶面 + 前侧面（立体的厚度），卡片要放在整个键帽下方
  const key = $("board").querySelectorAll(".key3d")[selKey];
  const top = key.querySelector(".cap").getBoundingClientRect(), front = key.querySelector(".ks.f").getBoundingClientRect();
  const cap = { left: top.left, width: top.width, top: top.top, bottom: Math.max(top.bottom, front.bottom) };
  const sr = st.getBoundingClientRect();
  const pw = pop.offsetWidth, ph = pop.offsetHeight;
  const cx = cap.left + cap.width / 2 - sr.left;
  const left = Math.max(12, Math.min(sr.width - pw - 12, cx - pw / 2));
  const below = cap.bottom - sr.top + 16;
  // 上下位置只在出现时决定一次，跟随过程中不来回翻
  // 优先放下方（矮屏幕上可以盖住底部工具条），实在放不下才放上方
  if (decide || !pop.dataset.side) pop.dataset.side = below + ph > sr.height - 12 ? "above" : "below";
  const above = pop.dataset.side === "above";
  const y = above ? Math.max(12, cap.top - sr.top - ph - 16) : Math.min(below, sr.height - ph - 12);
  pop.classList.toggle("above", above);
  pop.style.setProperty("--ax", Math.max(18, Math.min(pw - 18, cx - left)) + "px");
  pop.style.transform = `translate(${Math.round(left)}px, ${Math.round(y)}px)`;
}

// 镜头 / 键帽还在动画里时，连续几帧跟踪位置
function followPop(ms = 1100) {
  const end = performance.now() + ms;
  cancelAnimationFrame(followPop.raf);
  const tick = () => { placePop(); if (performance.now() < end && !$("pop").hidden) followPop.raf = requestAnimationFrame(tick); };
  followPop.raf = requestAnimationFrame(tick);
  // 兜底：后台标签页等情况下 rAF 可能暂停，定时再校正两次
  clearTimeout(followPop.t1); clearTimeout(followPop.t2);
  followPop.t1 = setTimeout(placePop, ms / 2);
  followPop.t2 = setTimeout(placePop, ms + 50);
}

// 说明是空的、或者之前是自动生成的，就跟着组合键自动更新
function touchDesc(p, k) {
  if (!k.desc || k.descAuto) { k.desc = autoDesc(p, k); k.descAuto = true; }
}

// ====================================================================== 键盘事件：录制组合键 / Esc 关闭
window.addEventListener("keydown", e => {
  if (recording < 0) {
    if (e.key === "Escape" && selKey >= 0 && !isField(e.target)) closePop();
    return;
  }
  if (isField(e.target)) return;
  const p = presets[active];
  if (!p || p.media) return;
  e.preventDefault();
  e.stopPropagation();
  if (["ControlLeft", "ControlRight", "ShiftLeft", "ShiftRight", "AltLeft", "AltRight",
       "MetaLeft", "MetaRight", "OSLeft", "OSRight"].includes(e.code)) return;   // 等真正的按键
  const hid = CODE_TO_HID[e.code];
  if (hid === undefined) { notice(`这个键（${e.code}）键盘发不了，请换一个。`, "warn"); return; }
  const k = p.keys[recording];
  k.mod = (e.ctrlKey ? 0x01 : 0) | (e.shiftKey ? 0x02 : 0) | (e.altKey ? 0x04 : 0) | (e.metaKey ? 0x08 : 0);
  k.k1 = hid; k.k2 = 0;
  touchDesc(p, k);
  recording = -1;
  notice("");
  render();
}, true);

// 点卡片和键帽以外的地方，关掉卡片
document.addEventListener("pointerdown", e => {
  if (selKey < 0) return;
  if (e.target.closest("#pop, .cap, .topbar, .dock, #notice")) return;
  closePop();
});

// 鼠标视差：模型跟着指针轻微偏转
$("stage").addEventListener("pointermove", e => {
  if (e.pointerType !== "mouse" || e.target.closest("#pop, .dock")) return;
  const r = $("stage").getBoundingClientRect();
  const nx = (e.clientX - r.left) / r.width - .5, ny = (e.clientY - r.top) / r.height - .5;
  const k = document.body.dataset.view === "edit" ? .35 : 1;
  $("stage").style.setProperty("--px", `${(-ny * 9 * k).toFixed(2)}deg`);
  $("stage").style.setProperty("--py", `${(nx * 12 * k).toFixed(2)}deg`);
  placePop();
});
$("stage").addEventListener("pointerleave", () => {
  $("stage").style.setProperty("--px", "0deg");
  $("stage").style.setProperty("--py", "0deg");
  followPop(600);
});
$("stage").addEventListener("transitionend", e => { if (e.target.classList.contains("tilt")) placePop(); });
window.addEventListener("resize", layoutStage);

// ====================================================================== 按钮
$("btnConnect").onclick = async () => {
  if (!port) return connect();
  const n = dirtyCount();
  if (n && !confirm(`还有 ${n} 组改动没写入键盘，断开后这些改动会丢失。确定断开？`)) return;
  await disconnect();
  notice("已断开键盘。", "ok");
};
$("btnRead").onclick = async () => {
  if (dirtyCount() && !confirm("页面上有还没写入的改动，重新读取会丢掉它们。继续？")) return;
  try { await readFromDevice(); notice("已从键盘读取。", "ok"); } catch (e) { notice(e.message, "err"); }
};
$("btnWrite").onclick = () => { finishNameEdit(); writeToDevice(); };
$("btnUse").onclick = useOnDevice;
$("btnReset").onclick = resetDevice;
$("btnLog").onclick = () => {
  $("logPanel").hidden = !$("logPanel").hidden;
  $("btnLog").classList.toggle("on", !$("logPanel").hidden);
  logEl.scrollTop = logEl.scrollHeight;
};

$("btnExport").onclick = () => {
  const data = JSON.stringify({ app: "keybrick-keymap", version: 1, presets: presets.map(stripAuto) }, null, 2);
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([data], { type: "application/json" }));
  a.download = "keybrick-keymap.json";
  a.click();
  URL.revokeObjectURL(a.href);
};
$("btnImport").onclick = () => $("fileInput").click();
$("fileInput").onchange = async e => {
  const file = e.target.files[0];
  e.target.value = "";
  if (!file) return;
  try {
    const data = JSON.parse(await file.text());
    if (data.app !== "keybrick-keymap" || !Array.isArray(data.presets)) throw new Error("不是改键导出的文件");
    if (data.presets.length !== presetCount) throw new Error(`文件里有 ${data.presets.length} 组预设，键盘是 ${presetCount} 组`);
    presets = data.presets.map(p => ({ ...p, keys: p.keys.map(k => ({ ...k, descAuto: false })) }));
    selKey = -1;
    render();
    notice("已导入到页面。确认无误后点「写入键盘」。", "ok");
  } catch (err) { notice("导入失败：" + err.message, "err"); }
};

if ("serial" in navigator) {
  navigator.serial.addEventListener("disconnect", async e => {
    if (e.target !== port) return;
    const n = dirtyCount();
    await disconnect();
    notice(n ? `键盘已拔出，${n} 组还没写入的改动已丢失。` : "键盘已拔出。", "warn");
  });
} else {
  notice("这个浏览器不支持 Web Serial。请用电脑版 Chrome 或 Edge 打开本页面。", "err");
}
window.addEventListener("beforeunload", e => {
  if (dirtyCount()) { e.preventDefault(); e.returnValue = ""; }
});

buildKeyboard();
buildPop();
layoutStage();
render();
</script>
</body>
</html>
